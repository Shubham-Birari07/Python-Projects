{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Billing System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'invoices/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'home' %}">Billing System</a>
            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'all-invoices' %}">Invoices</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'signup' %}">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; Billing System. All rights reserved.</p>
    </footer>

</body>
</html>
